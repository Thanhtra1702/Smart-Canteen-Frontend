<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Canteen - Zalo Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F7FAFE;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #131B2E;
      }
      @keyframes sc-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes sc-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes sc-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .sc-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #F7FAFE;
        max-width: 896px;
        margin: 0 auto;
        border-left: 1px solid #E2E8F0;
        border-right: 1px solid #E2E8F0;
      }
      .sc-bar-track {
        height: 3px;
        width: 100%;
        background: #DBEAFE;
        overflow: hidden;
      }
      .sc-bar-fill {
        height: 100%;
        width: 35%;
        background: #0057b8;
        border-radius: 9999px;
        animation: sc-bar 1.2s ease-in-out infinite;
      }
      .sc-header-skel {
        height: 56px;
        background: #ffffff;
        border-bottom: 1px solid #E2E8F0;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sc-skel-box {
        background: #E2E8F0;
        border-radius: 12px;
        animation: sc-pulse 1.5s ease-in-out infinite;
      }
      .sc-center-status {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        gap: 12px;
      }
      .sc-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #DBEAFE;
        border-top-color: #0057b8;
        border-radius: 9999px;
        animation: sc-spin 0.8s linear infinite;
      }
      .sc-status-text {
        font-size: 13px;
        font-weight: 600;
        color: #475569;
      }
    </style>
  </head>
  <body class="bg-[#F7FAFE] text-[#131B2E]">
    <div id="root">
      <div class="sc-boot">
        <div class="sc-bar-track"><div class="sc-bar-fill"></div></div>
        <div class="sc-header-skel">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="sc-skel-box" style="width:36px;height:36px;border-radius:10px;"></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <div class="sc-skel-box" style="width:88px;height:9px;"></div>
              <div class="sc-skel-box" style="width:140px;height:12px;"></div>
            </div>
          </div>
          <div>
            <div class="sc-skel-box" style="width:36px;height:36px;border-radius:9999px;"></div>
          </div>
        </div>
        <div class="sc-center-status">
          <div class="sc-spinner"></div>
          <div class="sc-status-text">Đang tải Smart Canteen...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
